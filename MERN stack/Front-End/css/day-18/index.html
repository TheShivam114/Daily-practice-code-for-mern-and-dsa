<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>

  <title>Dribbble UI</title>
</head>

<body class="bg-[#f8f7f4] font-sans">

  <!-- 🔥 NAVBAR (Glass Effect) -->
  <header class="fixed top-0 w-full z-50 backdrop-blur-md bg-white/70 border-b">
    <div class="flex justify-between items-center px-10 py-4">

      <h1 class="text-2xl font-bold tracking-tight">Dribbble</h1>

      <nav class="hidden md:flex gap-8 text-gray-700 font-medium">
        <a href="#" class="hover:text-black transition">Explore</a>
        <a href="#" class="hover:text-black transition">Hire Talent</a>
        <a href="#" class="hover:text-black transition">Get Hired</a>
        <a href="#" class="hover:text-black transition">Community</a>
      </nav>

      <div class="flex items-center gap-4">
        <button class="px-4 py-2 text-gray-700 hover:text-black">Sign up</button>
        <button class="px-5 py-2 rounded-full bg-gradient-to-r from-pink-500 to-purple-500 text-white shadow-lg hover:scale-105 transition">
          Log in
        </button>
      </div>

    </div>
  </header>

  <!-- 🔥 HERO -->
  <section class="pt-32 text-center px-5">

    <h1 class="text-5xl md:text-7xl font-bold leading-tight tracking-tight">
      Discover the <br>
      <span class="bg-gradient-to-r from-pink-500 to-purple-500 text-transparent bg-clip-text">
        World’s Top Designers
      </span>
    </h1>

    <p class="mt-6 text-gray-600 text-lg max-w-2xl mx-auto">
      Explore work from the most talented designers ready to take on your next project.
    </p>

    <!-- 🔍 FLOATING SEARCH -->
    <div class="mt-10 flex justify-center">
      <div class="flex items-center bg-white shadow-xl rounded-full px-6 py-3 w-full max-w-xl hover:shadow-2xl transition">
        <i class="ri-search-line text-gray-500 text-xl"></i>
        <input 
          type="text"
          placeholder="What are you looking for?"
          class="w-full outline-none px-4 bg-transparent"
        >
        <button class="bg-black text-white px-5 py-2 rounded-full hover:bg-gray-800 transition">
          Search
        </button>
      </div>
    </div>

    <!-- FILTER -->
    <div class="mt-8 flex justify-center gap-4 flex-wrap">
      <button class="px-5 py-2 rounded-full bg-black text-white shadow">Shots</button>
      <button class="px-5 py-2 rounded-full bg-white border hover:bg-gray-100">Designers</button>
      <button class="px-5 py-2 rounded-full bg-white border hover:bg-gray-100">Services</button>
    </div>

  </section>

  <!-- 🔥 GRID -->
  <section class="px-6 py-16">
    <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">

      <!-- CARD -->
      <div class="group relative rounded-2xl overflow-hidden cursor-pointer">

        <!-- IMAGE -->
        <img 
          src="https://plus.unsplash.com/premium_photo-1770749403846-78ca39f655b1" 
          class="w-full h-[260px] object-cover transition duration-500 group-hover:scale-110"
        >

        <!-- OVERLAY -->
        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition duration-300 backdrop-blur-sm"></div>

        <!-- CONTENT -->
        <div class="absolute bottom-0 w-full p-4 translate-y-full group-hover:translate-y-0 transition duration-300">
          <div class="flex justify-between items-center text-white">

            <div>
              <h4 class="font-semibold">Liere Cavia</h4>
              <p class="text-sm opacity-80">UI Designer</p>
            </div>

            <div class="flex gap-2">
              <i class="ri-heart-fill bg-white text-black p-2 rounded-full hover:bg-red-500 hover:text-white transition"></i>
              <i class="ri-bookmark-fill bg-white text-black p-2 rounded-full hover:bg-black hover:text-white transition"></i>
            </div>

          </div>
        </div>

      </div>

      <!-- REPEAT CARD -->
      <div class="group relative rounded-2xl overflow-hidden">
        <img src="https://images.unsplash.com/photo-1528120369764-0423708119ae"
          class="w-full h-[260px] object-cover transition duration-500 group-hover:scale-110">

        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition backdrop-blur-sm"></div>

        <div class="absolute bottom-0 w-full p-4 translate-y-full group-hover:translate-y-0 transition">
          <div class="flex justify-between text-white">
            <h4>Creative Work</h4>
            <i class="ri-heart-fill bg-white text-black p-2 rounded-full"></i>
          </div>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
