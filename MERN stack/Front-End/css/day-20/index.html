<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body class="bg-gray-50 font-sans">

  <nav class="flex items-center justify-between p-5 bg-white shadow-md">
    <h1 class="text-2xl font-bold text-indigo-600">MyBrand</h1>
    <ul class="hidden md:flex gap-6 text-gray-600 font-medium">
      <li class="hover:text-indigo-600 cursor-pointer transition duration-300 hover:scale-110">Home</li>
      <li class="hover:text-indigo-600 cursor-pointer transition duration-300 hover:scale-110">About</li>
      <li class="hover:text-indigo-600 cursor-pointer transition duration-300 hover:scale-110">Services</li>
      <li class="hover:text-indigo-600 cursor-pointer transition duration-300 hover:scale-110">Contact</li>
    </ul>
    <button class="bg-indigo-600 text-white px-4 py-2 rounded-xl hover:bg-indigo-700 transition hover:scale-105">
      Login
    </button>
  </nav>

  <section class="text-center py-20 bg-gradient-to-r from-indigo-500 to-purple-500 text-white">
    <h2 class="text-4xl md:text-6xl font-bold mb-6 animate-float">
      Build Beautiful Websites
    </h2>
    <p class="text-lg mb-6 fade-up">Design modern UI with smooth animations</p>
    <button class="bg-white text-indigo-600 px-6 py-3 rounded-xl font-semibold hover:bg-gray-200 transition hover:scale-110 fade-up">
      Get Started
    </button>
  </section>
  <section class="py-16 px-6">
    <h2 class="text-3xl font-bold text-center mb-10 fade-up">Our Services</h2>

    <div class="grid md:grid-cols-3 gap-8">
      <div class="bg-white p-6 rounded-2xl shadow-lg hover:shadow-2xl transition hover:-translate-y-3 fade-up">
        <h3 class="text-xl font-semibold mb-3">Web Design</h3>
        <p class="text-gray-600">Modern and clean UI design.</p>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-lg hover:shadow-2xl transition hover:-translate-y-3 fade-up">
        <h3 class="text-xl font-semibold mb-3">Development</h3>
        <p class="text-gray-600">Fast and scalable apps.</p>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-lg hover:shadow-2xl transition hover:-translate-y-3 fade-up">
        <h3 class="text-xl font-semibold mb-3">SEO</h3>
        <p class="text-gray-600">Rank higher on Google.</p>
      </div>

    </div>
  </section>
  <footer class="bg-gray-900 text-white text-center p-6">
    <p>© 2026 MyBrand. All rights reserved.</p>
  </footer>
  <script>
    const elements = document.querySelectorAll('.fade-up');

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('show');
        }
      });
    });

    elements.forEach(el => observer.observe(el));
  </script>

</body>
</html>
